version: 2

models:
  - name: stg_stack_exchange__questions
    description: "Staged Stack Exchange questions"
    columns:
      - name: question_id
        description: "Primary key for questions"
        tests:
          - unique
          - not_null

  - name: stg_stack_exchange__answers
    description: "Staged Stack Exchange answers"
    columns:
      - name: answer_id
        description: "Primary key for answers"
        tests:
          - unique
          - not_null
      - name: question_id
        description: "Foreign key to the question this answer belongs to"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stack_exchange__questions')
                field: question_id
              config:                    
                severity: warn